name: Build Server

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  linux:
    name: Linux x64 binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build
        run: cargo build --release -p offmessenger-server
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: offmessenger-server-linux-x64
          path: target/release/offmessenger-server
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 binary
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build
        run: cargo build --release -p offmessenger-server
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: offmessenger-server-windows-x64
          path: target/release/offmessenger-server.exe
          if-no-files-found: error
          retention-days: 30
