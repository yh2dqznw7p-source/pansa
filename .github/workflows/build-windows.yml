name: Build Windows (client + support .exe)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with: { workspaces: "." }

      - name: npm ci
        run: npm ci

      - name: Build frontends
        run: |
          npm run build:client
          npm run build:support

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build client (MSI + NSIS)
        run: npx tauri build --config client/tauri.conf.json --bundles msi nsis

      - name: Build support (MSI + NSIS)
        run: npx tauri build --config support/tauri.conf.json --bundles msi nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Recurse -Path target/release/bundle -Include *.msi,*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts -Force
          }
          if (Test-Path target/release/OffMessenger.exe) { Copy-Item target/release/OffMessenger.exe -Destination artifacts -Force }
          if (Test-Path "target/release/OffMessenger Support.exe") { Copy-Item "target/release/OffMessenger Support.exe" -Destination artifacts -Force }
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: offmessenger-windows
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
